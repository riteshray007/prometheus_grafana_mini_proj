apiVersion: apps/v1
kind: Deployment
metadata:
  name: pro_graf_k8s
spec:
  selector:
    matchLabels:
      app: pro_graf_k8s
  template:
    metadata:
      labels:
        app: pro_graf_k8s
    spec:
      containers:
      - name: pro_graf_k8s
        image: flask_metrics_app
        imagePullPolicy: Never
        resources:
          limits:
            memory: "70Mi"
            cpu: "200m"
        ports:
        - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: pro_graf_k8s
spec:
  selector:
    app: myapp
  ports:
  - port: 8080
    targetPort: 5000
